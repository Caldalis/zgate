# ── 6. 写 ~/.ssh/authorized_keys vs 写 ./src/main.ts ───────────────────

- id: write-authorized-keys-via-write-tool
  setup: { mkdir: ["repo"] }
  cwd: "repo"
  tool: Write
  tool_input: { file_path: "~/.ssh/authorized_keys", content: "ssh-ed25519 AAA" }
  expect:
    verb: write
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: fs.credential_write

- id: write-authorized-keys-via-redirect
  # verb 是 exec(D2.5:重定向的 verb 跟左边的命令走),规则层从原文认重定向(D12.2)
  setup: { mkdir: ["repo"] }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "echo 'ssh-ed25519 AAA' >> ~/.ssh/authorized_keys" }
  expect:
    verb: exec
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: fs.credential_write

- id: write-authorized-keys-wrapped-in-bash-c
  setup: { mkdir: ["repo"] }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "bash -c 'echo k >> ~/.ssh/authorized_keys'" }
  expect:
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: fs.credential_write

- id: write-src-main-via-write-tool
  setup:
    git: { dir: "repo", branch: "main" }
    write: { "repo/src/main.ts": "export {};\n" }
  cwd: "repo"
  tool: Write
  tool_input: { file_path: "./src/main.ts", content: "export const x = 1;\n" }
  expect:
    verb: write
    rule_verdict: PASS
    verdict: allow

- id: write-src-main-via-redirect
  setup:
    git: { dir: "repo", branch: "main" }
    write: { "repo/src/main.ts": "export {};\n" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "echo 'export {}' > ./src/main.ts" }
  expect:
    verb: exec
    rule_verdict: PASS
    verdict: allow

- id: copy-into-aws-credentials
  setup:
    git: { dir: "repo", branch: "main" }
    write: { "repo/key": "k\n" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "cp key ~/.aws/credentials" }
  expect:
    verb: write
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: fs.credential_write

