# ── 8. 复合语句切分 ─────────────────────────────────────────────────────

- id: cd-and-rm-splits
  # §12 原文写的是"切分成两个 Action"。cd 是 shell 内建,按 D2.3 / D6.4 不产出
  # Action,所以这里是 1 条 —— 切分成功由 rm 的目标是 b(而不是整条原文)证明。
  # 真正产出两条的写法见下一条。
  setup: { mkdir: ["repo", "repo/a", "repo/b"] }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "cd a && rm -rf b" }
  expect:
    actions: 1
    verbs: [delete]
    verb: delete
    rule_verdict: PASS
    verdict: allow

- id: mkdir-and-rm-splits-into-two
  setup: { mkdir: ["repo", "repo/b"] }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "mkdir c && rm -rf b" }
  expect:
    actions: 2
    verbs: [write, delete]
    rule_verdict: PASS
    verdict: allow

- id: danger-in-second-segment
  setup:
    git: { dir: "repo", branch: "main" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "git status && rm -rf /" }
  expect:
    actions: 2
    verbs: [read, delete]
    verb: delete
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: fs.rm_root

- id: pipeline-splits
  setup:
    write: { "repo/a.txt": "hi\n" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "cat a.txt | grep foo" }
  expect:
    actions: 2
    verbs: [read, read]
    rule_verdict: PASS
    verdict: allow

# ── 9. $(...) / eval → unknown → SOFT ───────────────────────────────────

- id: command-substitution-is-unknown
  setup: { mkdir: ["repo"] }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "$(echo rm) -rf /" }
  expect:
    verb: unknown
    rule_verdict: SOFT
    verdict: ask
    rule_id: fs.unknown

- id: eval-is-unknown
  setup: { mkdir: ["repo"] }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "eval rm -rf /" }
  expect:
    verb: unknown
    rule_verdict: SOFT
    verdict: ask

- id: backticks-are-unknown
  setup: { mkdir: ["repo"] }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "`echo rm` -rf /" }
  expect:
    verb: unknown
    rule_verdict: SOFT
    verdict: ask

- id: fork-bomb
  # 解析出零条命令,适配器兜成一条 unknown(D6.2),pre 轮按原文形态判死
  setup: { mkdir: ["repo"] }
  cwd: "repo"
  tool: Bash
  tool_input: { command: ":(){ :|:& };:" }
  expect:
    verb: unknown
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: fs.fork_bomb

