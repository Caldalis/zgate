- id: agent-tool-is-skipped
  # Task 的新名字;子 agent 的工具调用各自触发 hook
  setup: { mkdir: ["repo"] }
  cwd: "repo"
  tool: Agent
  tool_input: { prompt: "explore", description: "d", subagent_type: "Explore" }
  expect:
    actions: 0
    rule_verdict: PASS
    verdict: allow

