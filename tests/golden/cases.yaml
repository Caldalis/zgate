# SPEC.md §12 —— golden test。由 tests/pipeline.test.ts 驱动。
#
# 每条用例在独立的临时目录里跑,走**完整生产路径**:hook 输入 → 适配器 → 管线。
# 不手写 Action:审计时两条漏判(D12.2、D12.10)都藏在手写 verb 的测试后面。
#
# 字段:
#   setup.mkdir             要建的目录(相对用例根)
#   setup.write             要写的文件 {路径: 内容}
#   setup.symlink           软链接 {link, target},都相对用例根
#   setup.git               {dir, branch, default_branch?}:写 .git/HEAD;
#                           给了 default_branch 才写 refs/remotes/origin/HEAD
#   cwd                     相对用例根,默认 "."
#   tool / tool_input       hook 输入原样
#   expect.actions          Action 条数(可选)
#   expect.verbs            全部 Action 的 verb,按序(可选)
#   expect.verb             定结论那条 Action 的 verb(可选)
#   expect.rule_verdict     HARD_DENY | SOFT | PASS(M1 与 verdict 一一对应,见驱动注释)
#   expect.verdict          deny | ask | allow
#   expect.rule_id          命中的规则(可选;allow 时恒为 null,不要写)
#   expect.resolved_contains  某个目标 resolved 后含这个子串(可选)

# ── 1. 软链接指向仓库外 vs 普通目录 ─────────────────────────────────────
# ★ 这两条是本项目的核心论点:同一条命令,不同环境,不同结论。

- id: rm-symlink-out-of-repo
  setup:
    mkdir: ["repo", "outside"]
    symlink: { link: "repo/build", target: "outside" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "rm -rf ./build" }
  expect:
    verb: delete
    rule_verdict: SOFT
    verdict: ask
    rule_id: fs.outside_cwd
    resolved_contains: "outside"

- id: rm-normal-build-dir
  setup:
    mkdir: ["repo", "repo/build"]
  cwd: "repo"
  tool: Bash
  tool_input: { command: "rm -rf ./build" }
  expect:
    verb: delete
    rule_verdict: PASS
    verdict: allow

# ── 2. git push --force 在默认分支 vs feature 分支 ───────────────────────

- id: force-push-on-default-branch
  setup:
    git: { dir: "repo", branch: "main", default_branch: "main" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "git push --force" }
  expect:
    verb: network
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: git.force_push_default

- id: force-push-on-feature-branch
  setup:
    git: { dir: "repo", branch: "feature/login", default_branch: "main" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "git push --force" }
  expect:
    verb: network
    rule_verdict: PASS
    verdict: allow

- id: force-push-into-default-from-feature
  setup:
    git: { dir: "repo", branch: "feature/login", default_branch: "main" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "git push --force origin HEAD:main" }
  expect:
    verb: network
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: git.force_push_into_default

- id: force-push-default-branch-unknown
  # 没有 origin/HEAD(git init 建的仓库)。不猜 main/master,但也绝不放行(D12.1)
  setup:
    git: { dir: "repo", branch: "main" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "git push --force" }
  expect:
    verb: network
    rule_verdict: SOFT
    verdict: ask
    rule_id: git.force_push_unknown

- id: force-push-hidden-behind-and
  setup:
    git: { dir: "repo", branch: "main", default_branch: "main" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "git status && git push --force" }
  expect:
    actions: 2
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: git.force_push_default

- id: force-push-wrapped-in-bash-c
  setup:
    git: { dir: "repo", branch: "main", default_branch: "main" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "bash -c 'git push --force'" }
  expect:
    verb: network
    rule_verdict: HARD_DENY
    verdict: deny
    rule_id: git.force_push_default

- id: plain-push-on-default-branch
  setup:
    git: { dir: "repo", branch: "main", default_branch: "main" }
  cwd: "repo"
  tool: Bash
  tool_input: { command: "git push origin main" }
  expect:
    verb: network
    rule_verdict: PASS
    verdict: allow

